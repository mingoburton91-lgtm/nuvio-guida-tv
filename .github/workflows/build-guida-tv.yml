name: Nuvio Guida TV APK

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/build-guida-tv.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager non trovato; contenuto SDK:"
            find "$ANDROID_HOME" -maxdepth 3 -type f -name sdkmanager -o -type d -name cmdline-tools
            exit 1
          fi
          echo "Uso $SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"
