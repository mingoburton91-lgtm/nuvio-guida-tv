          git apply --check /tmp/nuvio-guida-tv.patch
          git apply /tmp/nuvio-guida-tv.patch
          echo "=== FILE GUIDA TV ==="
          grep -RIlE "Guida TV|TvVoo|Palinsesto non disponibile" app/src 2>/dev/null || true
          echo "=== CONTENUTO TV GUIDE ==="
          sed -n '1,260p' app/src/main/java/com/nuvio/tv/ui/screens/tvguide/TvGuideScreen.kt 2>/dev/null || true
          echo "=== FILE AUTH / LOGIN / QR ==="
          find app/src/main/java -type f -name '*.kt' -print0 | xargs -0 grep -IlEi 'auth|login|account|qr|device.?code|authorize' 2>/dev/null | head -n 80 || true
      - name: Create signing key
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/guida-tv.jks" \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Nuvio Guida TV,O=Android,C=IT" -keyalg RSA -keysize 2048 -validity 10000
          echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/guida-tv.jks" >> "$GITHUB_ENV"
          echo "NUVIO_RELEASE_KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
          echo "NUVIO_RELEASE_KEY_PASSWORD=android" >> "$GITHUB_ENV"
          echo "NUVIO_RELEASE_STORE_PASSWORD=android" >> "$GITHUB_ENV"
      - name: Build separate Fire TV APK
        run: ./gradlew :app:assembleFullDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: nuvio-guida-tv-universal-apk
          path: app/build/outputs/apk/full/debug/*universal*.apk
          if-no-files-found: error
          retention-days: 30
